name: Build and distribute weekly blog PDF

on:
  schedule:
    # Mondays at 05:00 UTC. (GitHub cron is always UTC; adjust for local time.)
    - cron: "0 5 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "urls.txt"

# Allow the workflow to commit the updated state/seen.json back to the repo.
permissions:
  contents: write
  id-token: write

concurrency:
  group: build-blog-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # PDF layout: compact (smaller single-column) | twocol (Paged-Out) | comfortable
      PDF_LAYOUT: compact
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Pandoc + WeasyPrint deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-dejavu-core \
            fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Detect new posts
        id: detect
        run: python src/detect.py

      - name: Extract new posts
        if: steps.detect.outputs.has_new == 'true'
        run: python src/extract.py

      - name: Build PDF
        id: build
        if: steps.detect.outputs.has_new == 'true'
        run: python src/build_pdf.py

      - name: Package weekly ZIP
        id: package
        if: steps.detect.outputs.has_new == 'true'
        run: python src/package_downloads.py

      # Workload Identity Federation keeps Google Cloud service-account keys out
      # of GitHub. These steps remain disabled until the documented repository
      # variables are configured, so forks can still build PDF artifacts alone.
      - name: Authenticate to Google Cloud
        if: steps.detect.outputs.has_new == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Load distribution secrets
        id: distribution_secrets
        if: steps.detect.outputs.has_new == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            oauth_client_id:${{ vars.GCP_PROJECT_ID }}/estafette-google-oauth-client-id
            oauth_client_secret:${{ vars.GCP_PROJECT_ID }}/estafette-google-oauth-client-secret
            token_encryption_key:${{ vars.GCP_PROJECT_ID }}/estafette-token-encryption-key

      - name: Install Drive distributor dependencies
        if: steps.detect.outputs.has_new == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        run: pip install -r backend/requirements.txt

      - name: Distribute PDFs to registered Google Drives
        if: steps.detect.outputs.has_new == 'true' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ steps.distribution_secrets.outputs.oauth_client_id }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ steps.distribution_secrets.outputs.oauth_client_secret }}
          TOKEN_ENCRYPTION_KEY: ${{ steps.distribution_secrets.outputs.token_encryption_key }}
        run: python backend/distribute.py

      - name: Publish PDF and ZIP downloads
        if: steps.detect.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="edition-${GITHUB_RUN_ID}"
          release_title="Estafette weekly edition · $(date -u +'%Y-%m-%d')"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" dist/*.pdf dist/*.zip --clobber
          else
            gh release create "$release_tag" dist/*.pdf dist/*.zip \
              --title "$release_title" \
              --notes "Weekly Estafette security-reading bundle. Download a PDF or the complete ZIP archive."
          fi

      - name: Upload downloads as workflow artifact
        if: steps.detect.outputs.has_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-edition
          path: |
            dist/*.pdf
            dist/*.zip
          if-no-files-found: ignore

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update processed posts state [skip ci]"
            git push
          fi
