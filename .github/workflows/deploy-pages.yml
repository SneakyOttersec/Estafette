name: Redeploy Estafette site from validated snapshot

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure registration endpoint
        env:
          ESTAFETTE_API_URL: ${{ vars.ESTAFETTE_API_URL }}
        run: envsubst '$ESTAFETTE_API_URL' < site/config.template.js > site/config.js

      - name: Expand the last validated reMarkable snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/estafette-release
          gh release download remarkable-content \
            --pattern remarkable-content.tar.gz \
            --dir /tmp/estafette-release
          python src/expand_remarkable_snapshot.py \
            /tmp/estafette-release/remarkable-content.tar.gz site

      - name: Configure Pages
        # The repository's Pages publishing source is configured as GitHub Actions.
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
